<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#2a2119"/><stop offset="60%" stop-color="#161009"/><stop offset="100%" stop-color="#0b0805"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6db8e"/><stop offset="45%" stop-color="#dcb75f"/><stop offset="100%" stop-color="#b07f34"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="10.5" y="10.5" width="491" height="491" rx="114" fill="none" stroke="url(#gold)" stroke-opacity=".55" stroke-width="3"/>

  <!-- Two overlapping circles with small tight connection -->
  <!-- Left circle -->
  <circle cx="160" cy="256" r="110" fill="none" stroke="url(#gold)" stroke-width="5" stroke-opacity=".9"/>

  <!-- Right circle -->
  <circle cx="352" cy="256" r="110" fill="none" stroke="url(#gold)" stroke-width="5" stroke-opacity=".9"/>

  <!-- Green arrows around circles - flow indicators -->
  <g stroke="#2dd88c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left circle arrows -->
    <!-- Top-left arrow -->
    <path d="M 90 180 L 110 200 M 110 200 L 95 190"/>
    <!-- Top arrow -->
    <path d="M 160 130 L 160 155 M 160 155 L 150 140 M 160 155 L 170 140"/>
    <!-- Top-right arrow -->
    <path d="M 220 165 L 240 155 M 240 155 L 235 170"/>
    <!-- Bottom-left arrow -->
    <path d="M 95 330 L 115 310 M 115 310 L 110 325"/>
    <!-- Bottom arrow -->
    <path d="M 160 385 L 160 360 M 160 360 L 150 375 M 160 360 L 170 375"/>

    <!-- Right circle arrows -->
    <!-- Top arrow -->
    <path d="M 352 130 L 352 155 M 352 155 L 342 140 M 352 155 L 362 140"/>
    <!-- Top-right arrow -->
    <path d="M 422 165 L 442 155 M 442 155 L 437 170"/>
    <!-- Right arrow -->
    <path d="M 470 256 L 445 256 M 445 256 L 460 246 M 445 256 L 460 266"/>
    <!-- Bottom-right arrow -->
    <path d="M 420 340 L 440 355 M 440 355 L 425 345"/>
    <!-- Bottom arrow -->
    <path d="M 352 385 L 352 360 M 352 360 L 342 375 M 352 360 L 362 375"/>

    <!-- Center arrows (between circles) -->
    <!-- Upper center flow -->
    <path d="M 256 200 L 256 220 M 256 220 L 246 210 M 256 220 L 266 210"/>
    <!-- Lower center flow -->
    <path d="M 256 310 L 256 290 M 256 290 L 246 300 M 256 290 L 266 300"/>
